<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#0b6bcb" />
  <meta name="description" content="도쿄 디즈니랜드(TDL)·디즈니씨(TDS) 현장용 모바일 가이드 — 어트랙션, 화장실, 아이 키별 탑승, 현재 위치, 방향 안내" />
  <title>도쿄 디즈니 현장 가이드 (TDL·TDS)</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="./vendor/maplibre/maplibre-gl.css" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#map">지도로 건너뛰기</a>

  <header id="topbar">
    <div id="park-toggle" role="group" aria-label="파크 선택">
      <button data-park="TDL" type="button" aria-pressed="true">랜드<span class="pt-sub">TDL</span></button>
      <button data-park="TDS" type="button" aria-pressed="false">씨<span class="pt-sub">TDS</span></button>
    </div>
    <div class="search-wrap">
      <input id="search-input" type="search" placeholder="어트랙션·화장실 검색" aria-label="검색" autocomplete="off" />
    </div>
    <button id="loc-btn" class="topbtn" type="button" aria-label="현재 위치">
      <span aria-hidden="true">&#128205;</span>
    </button>
    <button id="filter-btn" class="topbtn" type="button" aria-label="필터">
      <span aria-hidden="true">&#9776;</span>
    </button>
  </header>

  <div id="loc-status" class="loc-status" role="status" aria-live="polite"></div>

  <main>
    <div id="map" aria-label="지도"></div>
    <div id="offline-banner" class="offline-banner" role="status" aria-hidden="true">오프라인 상태입니다 · 벡터 배경은 안 보일 수 있지만 목록·검색·즐겨찾기는 사용할 수 있어요</div>

    <section id="sheet" class="sheet" aria-hidden="true" aria-label="상세 패널">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <h2 id="sheet-title" class="sheet-title">상세</h2>
        <button id="sheet-close" class="iconbtn" type="button" aria-label="닫기">&#10005;</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </section>
  </main>

  <nav id="bottomnav" aria-label="주요 메뉴">
    <button data-tab="map" type="button" class="nav-on"><span class="nav-ico" aria-hidden="true">&#128506;</span><span class="nav-label">지도</span></button>
    <button data-tab="attractions" type="button"><span class="nav-ico" aria-hidden="true">&#127920;</span><span class="nav-label">어트랙션</span></button>
    <button data-tab="restrooms" type="button"><span class="nav-ico" aria-hidden="true">&#128701;</span><span class="nav-label">화장실</span></button>
    <button data-tab="favorites" type="button"><span class="nav-ico" aria-hidden="true">&#9733;</span><span class="nav-label">즐겨찾기</span></button>
    <button data-tab="settings" type="button"><span class="nav-ico" aria-hidden="true">&#9881;</span><span class="nav-label">설정</span></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./vendor/leaflet/leaflet.js"></script>
  <script src="./vendor/maplibre/maplibre-gl.js"></script>
  <script src="./vendor/pmtiles/pmtiles.js"></script>
  <script src="./vendor/protomaps/basemaps.js"></script>
  <script src="./vendor/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
